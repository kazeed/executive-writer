name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.6
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv run --with pytest-cov==7.0.0 pytest -q --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv export --locked --no-emit-project --format requirements-txt -o /tmp/audit.txt
      - run: uvx pip-audit==2.9.0 -r /tmp/audit.txt --disable-pip --no-deps
      - run: uvx bandit==1.8.6 -r src
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 git --redact /repo
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build -t executive-writer:local .
      - run: bash scripts/container-smoke.sh
      - run: docker save executive-writer:local -o /tmp/image.tar
      - run: docker run --rm -v /tmp/image.tar:/image.tar:ro aquasec/trivy:0.69.3 image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
